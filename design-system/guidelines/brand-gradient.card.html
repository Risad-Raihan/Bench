<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);padding:18px 20px;font-size:13px}.vhd{padding:22px;position:relative;overflow:hidden;border:var(--hairline)}.vhd:before{content:'';position:absolute;inset:0;background:linear-gradient(97deg,var(--magenta) 0%,transparent 74%);opacity:var(--venture-wash-opacity)}.vhd:after{content:'';position:absolute;top:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,var(--magenta) 0%,var(--magenta) 52%,transparent 100%)}.in{position:relative;display:flex;align-items:flex-end;justify-content:space-between}.in h3{font-size:31px;font-weight:600;letter-spacing:-.03em}.sub{font-size:13.5px;color:var(--venture-sub);margin-top:6px}.tags{display:flex;gap:7px;margin-top:13px}.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:4px 9px;border-radius:2px;border:1px solid rgba(255,255,255,.2);color:var(--venture-tag-ink);background:rgba(0,0,0,.3)}.tag.hot{border-color:var(--amber);color:var(--amber-label-strong);background:var(--amber-tint-strong)}.vstage{text-align:right;font-family:var(--font-mono)}.vstage b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--venture-stage-ink)}.vstage em{font-style:normal;display:block;font-size:34px;color:#fff;letter-spacing:-.02em;margin-top:6px;font-weight:500}.vstage span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--venture-stage-meta);display:block;margin-top:5px}</style></head><body><div class="vhd"><div class="in"><div><h3>ImmiClaw</h3><div class="sub">Study abroad automation for agents across West Africa</div><div class="tags"><span class="tag">45% AVL stake</span><span class="tag">Rashedun Nabi</span><span class="tag hot">19 days in stage</span></div></div><div class="vstage"><b>Stage</b><em>Validate</em><span>4 of 6 gates cleared</span></div></div></div></body></html>
