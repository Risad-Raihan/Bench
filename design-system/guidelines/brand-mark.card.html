<!-- @dsCard group="Brand" viewport="700x150" name="App mark & chrome bar" subtitle="19px copper square, mono B in --on-copper. Lit nav item carries a copper underline." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);padding:18px 20px;font-size:13px}.bar{display:flex;align-items:center;gap:14px;padding:11px 16px;border:var(--hairline);background:var(--bg2)}.mark{width:19px;height:19px;background:var(--copper);border-radius:2px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--on-copper);font-family:var(--font-mono)}.nav{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;gap:20px}.nav b{color:var(--ink);font-weight:500;position:relative}.nav b:after{content:'';position:absolute;left:0;right:0;bottom:-13px;height:1px;background:var(--copper)}.jump{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--faint);border:var(--hairline);padding:5px 10px;border-radius:2px;display:flex;gap:26px}</style></head><body><div class="bar"><div class="mark">B</div><div class="nav"><b>Pipeline</b><span>My work</span><span>Notes</span><span>Calendar</span><span>Decisions</span></div><div class="jump"><span>Jump to</span><kbd>⌘K</kbd></div></div></body></html>
