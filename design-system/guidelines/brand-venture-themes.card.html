<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);padding:16px 18px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.h{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:2px;padding:11px 12px;min-height:52px}.h i{position:absolute;inset:0;opacity:var(--venture-wash-opacity)}.h s{position:absolute;top:0;left:0;height:2px;width:100%;text-decoration:none}.h b{position:relative;font-size:13.5px;font-weight:600;letter-spacing:-.015em;display:block}.h span{position:relative;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-top:5px;white-space:nowrap}</style></head><body>
<div class="g">
