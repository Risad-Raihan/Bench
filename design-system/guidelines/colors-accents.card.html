<!-- @dsCard group="Colors" viewport="700x170" name="Accents — colour has a job" subtitle="Five accents, each with one meaning. Never decorative." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);padding:18px 20px;font-size:13px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.c s{display:block;height:34px;border-radius:var(--radius-2);text-decoration:none}.c b{display:block;font-size:13px;font-weight:500;margin-top:9px}.c span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}.c code{font-family:var(--font-mono);font-size:11px;color:var(--faint);letter-spacing:.06em}</style></head><body><div class="g">
<div class="c"><s style="background:var(--copper)"></s><b>Copper</b><code>#F26430</code><span>Primary action, Tech lane, brand mark</span></div>
<div class="c"><s style="background:var(--magenta)"></s><b>Magenta</b><code>#D63A8F</code><span>GTM lane, quotes, ImmiClaw identity</span></div>
<div class="c"><s style="background:var(--teal)"></s><b>Teal</b><code>#2E9E8F</code><span>Capital lane, cleared or done</span></div>
<div class="c"><s style="background:var(--amber)"></s><b>Amber</b><code>#F2A93B</code><span>The only warning colour</span></div>
<div class="c"><s style="background:var(--violet)"></s><b>Violet</b><code>#8B5CF6</code><span>Task born in a note, Dikkha identity</span></div>
</div></body></html>
