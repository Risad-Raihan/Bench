<!-- @dsCard group="Colors" viewport="700x150" name="Ink & hairlines" subtitle="Five ink levels on warm black. Dim and Faint were raised for contrast; Ash stays reserved for unfiled." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);padding:18px 20px;font-size:13px}.g{display:grid;grid-template-columns:1fr 1fr;gap:26px}.rows div{display:flex;align-items:baseline;gap:12px;padding:4px 0}.rows span{font-size:13.5px}.rows code{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--faint)}.lines s{display:block;height:0;border-top:1px solid;text-decoration:none;margin:10px 0 4px}.lines b{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}</style></head><body><div class="g"><div class="rows">
<div><span style="color:var(--ink)">Ink — titles and rows</span><code>#F3EBE6</code></div>
<div><span style="color:var(--body-ink)">Body ink — note prose</span><code>#d5c8c1</code></div>
<div><span style="color:var(--dim)">Dim — captions, secondary</span><code>#9b8d85</code></div>
<div><span style="color:var(--faint)">Faint — mono micro-labels</span><code>#7d716a</code></div>
<div><span style="color:var(--ash)">Ash — unfiled, personal</span><code>#463b36</code></div>
</div><div class="lines">
<b>line — default hairline</b><s style="border-color:var(--line)"></s><code style="font-family:var(--font-mono);font-size:11px;color:var(--faint)">#241a17</code>
<b style="display:block;margin-top:14px">line2 — hover / raised</b><s style="border-color:var(--line2)"></s><code style="font-family:var(--font-mono);font-size:11px;color:var(--faint)">#33251f</code>
</div></div></body></html>
