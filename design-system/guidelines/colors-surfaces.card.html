<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces — warm near-black" subtitle="Seven steps from page black to card hover. No pure #000, no cool greys." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);padding:18px 20px;font-size:13px}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.c s{display:block;height:44px;border:var(--hairline);border-radius:var(--radius-2);text-decoration:none}.c b{display:block;font-family:var(--font-mono);font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}.c code{font-family:var(--font-mono);font-size:11px;color:var(--faint)}</style></head><body><div class="g">
<div class="c"><s style="background:var(--root)"></s><b>root</b><code>#070605</code></div>
<div class="c"><s style="background:var(--bg2)"></s><b>bg2</b><code>#0a0807</code></div>
<div class="c"><s style="background:var(--bg)"></s><b>bg</b><code>#0d0a09</code></div>
<div class="c"><s style="background:var(--back-strip)"></s><b>strip</b><code>#100b09</code></div>
<div class="c"><s style="background:var(--panel)"></s><b>panel</b><code>#140f0d</code></div>
<div class="c"><s style="background:var(--active-row)"></s><b>active</b><code>#170f0d</code></div>
<div class="c"><s style="background:var(--panel2)"></s><b>hover</b><code>#1b1411</code></div>
</div></body></html>
