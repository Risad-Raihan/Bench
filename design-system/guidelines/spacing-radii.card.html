<div class="b" style="border-radius:1px">1px · dot</div>
<div class="b" style="border-radius:2px">2px · default</div>
<div class="b" style="border-radius:3px">3px · frame</div>
<div class="b" style="border-radius:3px;border-color:var(--line2);box-shadow:var(--shadow-menu)">3px + menu shadow</div>
</div>
